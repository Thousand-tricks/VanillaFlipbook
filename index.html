<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio Flipbook</title>

    <style>
        /* ============================================================
           SFONDO MODIFICABILE
           ============================================================
           ★ PER CAMBIARE LO SFONDO ★
           Sostituisci solo il nome del file dentro url("...")
           qui sotto. Il file deve trovarsi dentro la cartella "img".
           ============================================================ */
        :root {
            --sfondo: url("img/ImmagineSfondo.png");
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            /* Ottimizzazioni mobile: niente lampeggio blu al tocco
               e niente ingrandimento automatico del testo su iOS. */
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
            /* Colore di riserva: se l'immagine di sfondo non è
               disponibile, si vede questo colore scuro. */
            background-color: #1f2233;
            background-image: var(--sfondo);
            background-size: cover;        /* copre tutto lo schermo */
            background-position: center;   /* centra l'immagine */
            background-repeat: no-repeat;

            min-height: 100vh;   /* fallback per browser datati */
            min-height: 100dvh;  /* gestisce meglio la barra del browser su mobile */
            display: flex;
            flex-direction: column;
            justify-content: center;   /* centra verticalmente il gruppo */
            align-items: center;       /* centra orizzontalmente i figli */
            gap: 18px;
            padding: 20px;
        }

        /* ============================================================
           CONTENITORE DEL LIBRO (si sposta per il centraggio)
           ============================================================
           Questo riquadro viene spostato a sinistra/destra via
           JavaScript per ottenere il comportamento:
           - libro CHIUSO  -> copertina centrata da sola;
           - libro APERTO  -> rilegatura (punto tra le due pagine)
                              centrata.
           ============================================================ */
        #book-wrapper {
            width: 100%;
            max-width: 960px;   /* = 2 x maxWidth del flipbook (2 x 480) */
            transition: transform 0.7s ease;   /* scorrimento fluido */
            will-change: transform;
            /* Evita che durante lo sfoglio col dito venga selezionato
               accidentalmente del testo o delle immagini. */
            -webkit-user-select: none;
            user-select: none;
        }

        /* ============================================================
           STILE DELLE PAGINE
           ============================================================
           IMPORTANTE:
           - Qui sotto trovi le pagine del libro.
           - Ogni <div class="page"> ... </div> è UNA pagina.
           - Per CAMBIARE un'immagine basta modificare l'attributo
             src="" dell'<img> corrispondente (vedi sezione <body>).
           - Per AGGIUNGERE pagine in futuro: aggiungi sempre DUE nuovi
             blocchi <div class="page"> ... </div> (le pagine si aggiungono
             a coppie per mantenere il formato "libro aperto"
             con copertina e retro copertina singole).
           ============================================================ */
        #flipbook .page {
            background-color: #ffffff;
        }

        #flipbook .page img {
            width: 100%;
            height: 100%;
            object-fit: cover;   /* riempie la pagina senza deformare l'immagine */
            display: block;
            pointer-events: none; /* evita interferenze con il trascinamento del libro */
            -webkit-user-drag: none;
        }

        /* Link cliccabili dentro le pagine: riempiono tutta la pagina
           così l'immagine (che usa height:100%) continua a funzionare. */
        #flipbook .page a {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Su schermi piccoli: il libro occupa tutto lo schermo. */
        @media (max-width: 600px) {
            body {
                gap: 0;
                padding: 0;
            }
            #book-wrapper {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         LIBRO: QUI CI SONO LE PAGINE

         ★ COME CAMBIARE LE IMMAGINI ★
         Sostituisci solo il nome del file dentro src="...".
         Esempio: vuoi mettere "foto_vacanza.jpg" come copertina?
         Cambia  src="img/Immagine1.jpg"  in  src="img/foto_vacanza.jpg"

         ★ COME AGGIUNGERE PAGINE ★
         Copia uno di questi blocchi <div class="page">...</div>
         e incollalo prima del commento "FINE LIBRO".
         Aggiungi le pagine SEMPRE A COPPIE (due per volta) per
         mantenere il formato libro: copertina singola,
         pagine a due a due, retro copertina singola.
         ============================================================ -->
    <div id="book-wrapper">
        <div id="flipbook">

            <!-- PAGINA 1 — COPERTINA (da sola) -->
            <div class="page">
                <img src="img/Fronte.png" alt="Copertina">
            </div>

            <!-- PAGINA 2 — (sinistra della doppia pagina centrale) -->
            <div class="page">
                <img src="img/Immagine2.png" alt="Pagina 2">
            </div>

            <!-- PAGINA 3 — (destra della doppia pagina centrale) -->
            <div class="page">
                <img src="img/Immagine3.png" alt="Pagina 3">
            </div>

            <!-- PAGINA 4 — RETRO COPERTINA (da sola) -->
            <div class="page">
                <img src="img/1.png" alt="Retro copertina">
            </div>

            <!-- PAGINA 5 -->
            <div class="page">
                <img src="img/2.png" alt="Pagina 5 del libro Curare, cura">
            </div>

            <!-- PAGINA 6 -->
            <div class="page">
                <img src="img/3.png" alt="Pagina 6">
            </div>

            <!-- PAGINA 7 -->
            <div class="page">
                <img src="img/4.png" alt="Pagina 6">
            </div>
            <!-- PAGINA 8 -->
            <div class="page">
                <img src="img/5.png" alt="Pagina 6">
            </div>
            
            <div class="page">
                <img src="img/6.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/7.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/8.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/9.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/10.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/11.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/12.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/13.png" alt="Pagina 6">
            </div>

            <div class="page">
                <img src="img/14.png" alt="Pagina 6">
            </div>
            <div class="page">
                <img src="img/15.png" alt="Pagina 6">
            </div>
            <div class="page">
                <a href="https://www.ibs.it/curare-cura-percorsi-di-ricerca-libro-vari/e/9788885595613" target="_blank" rel="noopener">
                    <img src="img/ImmagineLink.png" alt="Acquista il libro Curare, cura su IBS">
                </a>
            </div>
            <!-- Ho aggiunto io style, Maria fa attenzione se leggi questo. Se crei uno tag con style cancella questo -->
            <div class="page">
                <img src="img/Retro.png" alt="Pagina 6" style="width: 100%; height: 100%; object-fit: contain;">
            </div>


            <!-- FINE LIBRO: aggiungi qui sopra eventuali nuove pagine -->

        </div>
    </div>

    <!-- ============================================================
         LIBRERIA STPAGEFLIP (in locale, nessuna dipendenza esterna)
         ============================================================ -->
    <script src="page-flip.browser.js"></script>

    <script>
        // ============================================================
        //  CREAZIONE DEL FLIPBOOK
        // ============================================================
        //  Spiegazione delle impostazioni principali:
        //
        //  width / height : proporzioni di UNA singola pagina.
        //                   I valori 750 x 1000 danno una pagina
        //                   verticale (rapporto 3:4), ideale per le foto.
        //
        //  showCover: true -> la prima e l'ultima pagina sono singole
        //                      (copertina e retro copertina), le altre
        //                      si mostrano affiancate come un libro aperto.
        //
        //  usePortrait: true -> su schermi stretti mostra UNA pagina
        //                       alla volta; su schermi larghi due pagine.
        // ============================================================
        const pageFlip = new St.PageFlip(document.getElementById("flipbook"), {
            width: 750,          // larghezza di una pagina (proporzione)
            height: 1000,        // altezza di una pagina (proporzione)
            size: "stretch",     // il libro si adatta alla larghezza del contenitore
            minWidth: 200,       // larghezza minima di una pagina (px)
            maxWidth: 480,       // larghezza massima di una pagina (px)
            minHeight: 200,      // altezza minima di una pagina (px)
            maxHeight: 700,      // altezza massima di una pagina (px)
            autoSize: true,      // ridimensiona automaticamente
            showCover: true,     // copertina e retro copertina singole
            usePortrait: true,   // mobile: una pagina alla volta; desktop: doppia
            drawShadow: true,    // ombre realistiche durante lo sfoglio
            flippingTime: 800,   // durata dell'animazione (millisecondi)
            disableFlipByClick: false,  // consente lo sfoglio cliccando sulla pagina
            showPageCorners: true,      // mostra il piegamento agli angoli
            useMouseEvents: true,       // abilita il trascinamento con il mouse
            mobileScrollSupport: true,  // su touch si può sfogliare col dito
            clickEventForward: true     // i clic sui link/button restano attivi
        });

        // Collega le pagine HTML (i blocchi <div class="page">) al flipbook.
        // Il numero di pagine viene calcolato automaticamente: non serve
        // indicarlo a mano.
        pageFlip.loadFromHTML(document.querySelectorAll("#flipbook .page"));

        const bookWrapper = document.getElementById("book-wrapper");

        // ============================================================
        //  CENTRAGGIO DINAMICO DEL LIBRO
        // ============================================================
        //  La libreria disegna:
        //  - la COPERTINA sulla metà DESTRA del blocco libro;
        //  - la RETRO COPERTINA sulla metà SINISTRA;
        //  - le due pagine centrali su entrambe le metà.
        //
        //  Per ottenere l'effetto richiesto, spostiamo tutto il libro:
        //  - libro chiuso  -> copertina centrata da sola;
        //  - libro aperto  -> rilegatura (spazio tra le due pagine) centrata.
        // ============================================================
        function aggiornaCentratura(animato) {
            const rect = pageFlip.getBoundsRect();
            const totale = pageFlip.getPageCount();
            const pagina = pageFlip.getCurrentPageIndex();

            // Se le dimensioni non sono ancora pronte, esce senza far nulla.
            if (!rect || !rect.pageWidth) {
                return;
            }

            const orientamento = pageFlip.getOrientation();
            const mezzaPagina = rect.pageWidth / 2;
            let spostamento = 0;

            // Lo spostamento serve SOLO in modalità "landscape" (due pagine
            // affiancate, tipica del desktop). In modalità "portrait"
            // (una pagina alla volta, tipica degli smartphone) la pagina
            // è già centrata dalla libreria e non va spostata.
            if (orientamento === "landscape") {
                if (totale > 1 && pagina === 0) {
                    // COPERTINA: è sulla metà destra, quindi la sposto
                    // a sinistra di mezza pagina per centrarla.
                    spostamento = -mezzaPagina;
                } else if (totale > 1 && pagina === totale - 1 && totale % 2 === 0) {
                    // RETRO COPERTINA: è sulla metà sinistra, quindi la sposto
                    // a destra di mezza pagina per centrarla.
                    spostamento = mezzaPagina;
                }
            }

            // Al primo allineamento non vogliamo l'animazione di scorrimento:
            // il libro deve partire già centrato.
            if (animato === false) {
                bookWrapper.style.transition = "none";
                bookWrapper.style.transform = "translateX(" + spostamento + "px)";
                void bookWrapper.offsetWidth; // forza il browser a rileggere la posizione
                bookWrapper.style.transition = "";
            } else {
                bookWrapper.style.transform = "translateX(" + spostamento + "px)";
            }
        }

        // L'evento "flip" scatta ogni volta che si cambia pagina.
        // e.data = indice della pagina attualmente visibile (parte da 0).
        pageFlip.on("flip", function () {
            // Riallinea il libro con l'animazione di scorrimento.
            aggiornaCentratura(true);
        });

        // Riallinea anche quando l'orientamento cambia o si ridimensiona la finestra.
        pageFlip.on("changeOrientation", function () {
            aggiornaCentratura(false);
        });

        window.addEventListener("resize", function () {
            aggiornaCentratura(false);
        });

        // Allineamento iniziale (senza animazione) appena la pagina è pronta.
        pageFlip.on("init", function () {
            requestAnimationFrame(function () {
                aggiornaCentratura(false);
            });
        });

        window.addEventListener("load", function () {
            requestAnimationFrame(function () {
                aggiornaCentratura(false);
            });
        });

        // ============================================================
        //  FRECCE DELLA TASTIERA (opzionale ma comodo)
        // ============================================================
        document.addEventListener("keydown", function (event) {
            if (event.key === "ArrowLeft") {
                pageFlip.flipPrev("top");
            } else if (event.key === "ArrowRight") {
                pageFlip.flipNext("top");
            }
        });
    </script>
</body>
</html>
